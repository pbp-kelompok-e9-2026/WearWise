<div class="wtb-field{% if field.errors %} wtb-field--error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="wtb-optional">Opsional</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="wtb-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {{ field.errors }}
</div>
