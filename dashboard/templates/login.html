{% extends 'base.html' %}

{% block meta %}
  <title>Login - WearWise</title>
{% endblock meta %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-lg shadow">
  <h1 class="text-2xl font-bold text-emerald-700 mb-6">Login WearWise</h1>

  {% if form.errors %}
    <p class="text-red-600 mb-4">Username atau password salah.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label class="block mb-2 text-sm">Username</label>
    <input type="text" name="username" class="w-full border rounded px-3 py-2 mb-4" required>

    <label class="block mb-2 text-sm">Password</label>
    <input type="password" name="password" class="w-full border rounded px-3 py-2 mb-4" required>

    <button type="submit" class="w-full bg-emerald-700 text-white py-2 rounded hover:bg-emerald-800">
      Login
    </button>
  </form>

  <p class="text-sm text-gray-500 mt-4">
  Belum punya akun?
  <a href="{% url 'dashboard:register' %}" class="text-emerald-700 underline">Daftar</a>
    </p>
</div>
{% endblock content %}
