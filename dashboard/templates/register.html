{% extends 'base.html' %}

{% block meta %}
  <title>Daftar - WearWise</title>
{% endblock meta %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-lg shadow">
  <h1 class="text-2xl font-bold text-emerald-700 mb-6">Daftar WearWise</h1>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label class="block mb-1 text-sm">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <p class="text-red-600 text-xs mb-2">{{ field.errors|striptags }}</p>
      {% endif %}
    {% endfor %}

    <button type="submit" class="w-full bg-emerald-700 text-white py-2 rounded hover:bg-emerald-800 mt-4">
      Daftar
    </button>
  </form>

  <p class="text-sm text-gray-500 mt-4">
    Sudah punya akun?
    <a href="{% url 'login' %}" class="text-emerald-700 underline">Login</a>
  </p>
</div>

<style>
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; border: 1px solid #d1d5db; border-radius: 0.375rem;
    padding: 0.5rem 0.75rem; margin-bottom: 0.75rem;
  }
</style>
{% endblock content %}
