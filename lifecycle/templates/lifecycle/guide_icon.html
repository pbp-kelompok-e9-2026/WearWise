{% if kind == "repair" %}
<span class="grid size-14 shrink-0 place-items-center rounded-full bg-clay-soft text-clay">
  <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5L20 18M8 16.5L20 6"/></svg>

{% elif kind == "reuse" %}

{% else %}
<span class="grid size-14 shrink-0 place-items-center rounded-full bg-olive text-ivory">
  <svg class="size-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l8-8"/></svg>
